<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="FixYourWebsite — Web Dev // App Security" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16101E"/>
      <stop offset="1" stop-color="#120B18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A277FF"/>
      <stop offset="1" stop-color="#F986FF"/>
    </linearGradient>
    <linearGradient id="ringRev" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F986FF"/>
      <stop offset="1" stop-color="#A277FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A277FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A277FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="299" fill="none" stroke="#2A1F38"/>

  <!-- soft halo -->
  <circle cx="210" cy="150" r="170" fill="url(#halo)"/>

  <!-- rings -->
  <g fill="none" filter="url(#glow)">
    <circle cx="210" cy="150" r="108" stroke="url(#ring)" stroke-width="3" stroke-dasharray="520 160" stroke-linecap="round" transform="rotate(-30 210 150)"/>
    <circle cx="210" cy="150" r="84" stroke="url(#ringRev)" stroke-width="3" stroke-dasharray="330 200" stroke-linecap="round" transform="rotate(110 210 150)"/>
    <circle cx="210" cy="150" r="60" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="250 127" stroke-linecap="round" transform="rotate(210 210 150)"/>
  </g>
  <circle cx="210" cy="150" r="118" fill="none" stroke="#A277FF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- center mark -->
  <text x="210" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" fill="#F8F8F2">X</text>

  <!-- divider -->
  <line x1="390" y1="70" x2="390" y2="230" stroke="#2A1F38" stroke-width="1"/>

  <!-- text -->
  <text x="430" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#B8A6C5">// github.com/FixYourWebsite</text>
  <text x="430" y="182" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#F8F8F2">FixYourWebsite</text>
  <text x="432" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#A277FF" letter-spacing="1">WEB DEV // APP SECURITY</text>
  <rect x="432" y="242" width="64" height="3" rx="1.5" fill="#F986FF"/>
</svg>
