<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="About" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A277FF"/><stop offset="1" stop-color="#F986FF"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="403" rx="14" fill="#16101E" stroke="#2A1F38"/>
  <rect x="0" y="24" width="4" height="356" rx="2" fill="url(#g)"/>
  <text x="44" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#A277FF">// <tspan fill="#F986FF">ABOUT</tspan></text>
  <line x1="44" y1="76" x2="956" y2="76" stroke="#2A1F38"/>
  <text x="44" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#F8F8F2">Your website is your storefront. When it's slow, broken or</text>
  <text x="44" y="166" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#F8F8F2">vulnerable, you lose customers and trust.</text>
  <text x="44" y="226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#B8A6C5">I'm a freelance web developer who builds, repairs and secures</text>
  <text x="44" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#B8A6C5">websites. You get working results, plain-language</text>
  <text x="44" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#B8A6C5">communication, and reports you can actually act on. No jargon</text>
  <text x="44" y="352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#B8A6C5">walls, no vague promises.</text>

