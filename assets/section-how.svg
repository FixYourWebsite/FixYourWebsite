<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How I work" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A277FF"/><stop offset="1" stop-color="#F986FF"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="519" rx="14" fill="#16101E" stroke="#2A1F38"/>
  <rect x="0" y="24" width="4" height="472" rx="2" fill="url(#g)"/>
  <text x="44" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#A277FF">// <tspan fill="#F986FF">HOW I WORK</tspan></text>
  <line x1="44" y1="76" x2="956" y2="76" stroke="#2A1F38"/>
  <text x="44" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#F986FF">1.</text>
  <text x="90" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F8F8F2">Brief</text>
  <text x="90" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#B8A6C5">You tell me the goal or the problem. I ask only what I need.</text>
  <text x="44" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#F986FF">2.</text>
  <text x="90" y="226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F8F8F2">Plan</text>
  <text x="90" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#B8A6C5">I reply with scope, approach and a clear next step.</text>
  <text x="44" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#F986FF">3.</text>
  <text x="90" y="326" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F8F8F2">Build or fix</text>
  <text x="90" y="362" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#B8A6C5">I keep changes clean and keep you updated.</text>
  <text x="44" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#F986FF">4.</text>
  <text x="90" y="426" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F8F8F2">Handover</text>
  <text x="90" y="462" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#B8A6C5">You get the result, a summary of what changed, and what to do next.</text>

</svg>
