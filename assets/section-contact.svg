  <text x="44" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#A277FF">// <tspan fill="#F986FF">CONTACT</tspan></text>
  <line x1="44" y1="76" x2="956" y2="76" stroke="#2A1F38"/>
  <text x="44" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F8F8F2">Got a site to build, fix or secure?</text>
  <text x="44" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#B8A6C5">Message me on Telegram with a short description of the task.</text>
  <text x="44" y="222" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#B8A6C5">I'll reply with a clear next step.</text>
  <text x="44" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#A277FF">Available for freelance web-development and web-security projects.</text>

